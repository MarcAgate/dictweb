name: Build macOS app

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verify Python
        run: |
          which python
          python --version
          which pip
          python -m pip --version

      - name: Install MariaDB tools
        run: |
          brew update
          brew install mariadb
          which mariadb_config
          mariadb_config --version

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "setuptools<82" wheel

      - name: Install dependencies
        run: |
          python -m pip install --no-build-isolation -r requirements.txt
          python -m pip install pyinstaller

      - name: Download SQLite database
        run: |
          rm -f MsTibTool.db
          curl -fL "https://www.buddhawiki.net/MsTibTool.db" -o MsTibTool.db
          test -f MsTibTool.db
          test -s MsTibTool.db
          file MsTibTool.db

      - name: Build macOS app with PyInstaller
        run: |
          python -m PyInstaller --clean --noconfirm dictweb-macos.spec

      - name: Check build output
        run: |
          ls -la dist
          test -d "dist/dictweb.app"

      - name: Start app for smoke test
        run: |
          python run.py > app.log 2>&1 &
          echo $! > app.pid

      - name: Wait for /login
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/login > /dev/null; then
              echo "Login page is up"
              exit 0
            fi
            sleep 2
          done
          echo "Server did not start in time"
          cat app.log || true
          exit 1

      - name: Smoke test login
        env:
          TEST_USERNAME: ${{ secrets.DICTWEB_TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.DICTWEB_TEST_PASSWORD }}
        run: |
          code=$(curl -sS -L \
            -c cookies.txt -b cookies.txt \
            -o response.html \
            -w "%{http_code}" \
            -X POST "http://127.0.0.1:8000/login" \
            -d "username=${TEST_USERNAME}" \
            -d "password=${TEST_PASSWORD}")
          echo "Final HTTP code: $code"
          test "$code" = "200"

      - name: Stop app
        if: always()
        run: |
          kill $(cat app.pid) || true
          cat app.log || true

      - name: Zip the macOS app
        run: |
          ditto -c -k --sequesterRsrc --keepParent "dist/dictweb.app" "dist/dictweb-macos.zip"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: dictweb-macos
          path: dist/dictweb-macos.zip
          if-no-files-found: error
          overwrite: true