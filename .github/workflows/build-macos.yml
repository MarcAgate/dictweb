name: Build macOS app

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify Python
        run: |
          which python
          python --version
          which pip
          python -m pip --version

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "setuptools<82" wheel

      - name: Install dependencies
        run: |
          python -m pip install --no-build-isolation -r requirements.txt
          python -m pip install pyinstaller

      - name: Download SQLite database
        run: |
          rm -f MsTibTool.db
          curl -fL "https://www.buddhawiki.net/MsTibTool.db" -o MsTibTool.db
          test -f MsTibTool.db
          test -s MsTibTool.db
          file MsTibTool.db

      - name: Build macOS app with PyInstaller
        run: |
          python -m PyInstaller --clean --noconfirm dictweb-macos.spec

      - name: Check build output
        run: |
          ls -la dist
          test -d "dist/dictweb.app"

      - name: Start app for smoke test
        run: |
          python run.py > app.log 2>&1 &
          echo $! > app.pid

      - name: Wait for /login
        shell: bash
        run: |
          for i in {1..30}; do
            code=$(curl --silent --output /dev/null --write-out "%{http_code}" http://127.0.0.1:8000/login || true)
            echo "Attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then
              echo "Login page is up"
              exit 0
            fi
            sleep 2
          done
          echo "Server did not start in time"
          cat app.log || true
          exit 1

      - name: Smoke test login
        shell: bash
        env:
          TEST_USERNAME: "admin"
          TEST_PASSWORD: "admin"
        run: |
          test -n "$TEST_USERNAME"
          test -n "$TEST_PASSWORD"

          code=$(curl -sS -L \
            -c cookies.txt -b cookies.txt \
            -o response.html \
            -w "%{http_code}" \
            -X POST "http://127.0.0.1:8000/login" \
            -d "username=${TEST_USERNAME}" \
            -d "password=${TEST_PASSWORD}")

          echo "Final HTTP code: $code"
          test "$code" = "200"

          grep -qi '<title>Recherche dans le dictionnaire</title>' response.html || {
            echo "La page finale n'est pas la page search attendue"
            head -n 80 response.html
            exit 1
          }

          grep -qi 'name="q"' response.html || {
            echo "Le formulaire de recherche n'a pas été trouvé"
            head -n 80 response.html
            exit 1
          }

      - name: Smoke test search query
        shell: bash
        run: |
          code=$(curl -sS -L \
            -c cookies.txt -b cookies.txt \
            -o search_response.html \
            -w "%{http_code}" \
            -X POST "http://127.0.0.1:8000/search" \
            -d "q=stobs" \
            -d "matchmode=contains")

          echo "Search HTTP code: $code"
          test "$code" = "200"

          grep -qi '<title>Recherche dans le dictionnaire</title>' search_response.html || {
            echo "La page de recherche n'a pas été rendue"
            head -n 100 search_response.html
            exit 1
          }

      - name: Stop app
        if: always()
        run: |
          kill "$(cat app.pid)" || true
          cat app.log || true

      - name: Zip the macOS app
        run: |
          ditto -c -k --sequesterRsrc --keepParent "dist/dictweb.app" "dist/dictweb-macos.zip"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: dictweb-macos
          path: dist/dictweb-macos.zip
          if-no-files-found: error
          overwrite: true